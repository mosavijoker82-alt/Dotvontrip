<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DOTONE RIDER — POSTEX</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101a;font-family:Arial,sans-serif;color:#fff}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#07111dcc,#07101a99);z-index:10}
.card{width:min(92vw,430px);padding:28px;border:1px solid #ffffff22;border-radius:24px;background:#101923ee;box-shadow:0 20px 70px #0009;text-align:center}
.logo{font-size:34px;font-weight:900;letter-spacing:3px}.sub{color:#ff9d2e;margin:7px 0 22px;font-weight:700}
button{border:0;border-radius:14px;padding:14px 20px;font-size:16px;font-weight:900;cursor:pointer;background:#ff8c1a;color:#111;width:100%;margin-top:10px}
button.alt{background:#ffffff14;color:#fff;border:1px solid #ffffff22}
#hud{display:none;position:fixed;inset:0;pointer-events:none;z-index:5}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px}
.pill{background:#07101add;border:1px solid #ffffff22;border-radius:13px;padding:9px 12px;font-size:12px}
#mission{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:min(88vw,420px);text-align:center;background:#07101add;border:1px solid #ffffff22;border-radius:14px;padding:10px}
#status{color:#ff9d2e;font-weight:800}
.controls{position:absolute;left:14px;right:14px;bottom:18px;display:flex;justify-content:space-between;align-items:end}
.joy{width:110px;height:110px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff25;pointer-events:auto;position:relative}
.knob{position:absolute;width:48px;height:48px;left:29px;top:29px;border-radius:50%;background:#ff8c1a99}
.actions{display:flex;gap:9px;pointer-events:auto}.act{width:82px;height:58px;padding:0;font-size:12px;margin:0}
#err{display:none;position:fixed;inset:0;z-index:30;background:#160d0ddd;padding:24px;color:#fff}
#err pre{white-space:pre-wrap;color:#ffb26b}
.small{font-size:12px;color:#9eabb8;line-height:1.5}
</style>
</head>
<body>
<div id="game"></div>

<div id="menu">
 <div class="card">
  <div class="logo">DOTONE RIDER</div>
  <div class="sub">POSTEX CITY DELIVERY</div>
  <p class="small">A mobile-first 3D delivery game. Play instantly as a guest — wallet is optional.</p>
  <button id="play">PLAY AS GUEST</button>
  <button id="wallet" class="alt">CONNECT DOTONE WALLET</button>
  <p id="walletState" class="small">Wallet: optional</p>
 </div>
</div>

<div id="hud">
 <div class="top">
  <div class="pill">🏆 <span id="coins">0</span> COINS</div>
  <div class="pill">LV <span id="level">1</span> · XP <span id="xp">0</span></div>
  <div class="pill">⚡ <span id="speed">0</span> km/h</div>
 </div>
 <div id="mission">📦 <b>MISSION</b><br><span id="status">Ride to the orange pickup point</span></div>
 <div class="controls">
  <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
  <div class="actions">
   <button class="act" id="brake">BRAKE</button>
   <button class="act" id="boost">BOOST</button>
  </div>
 </div>
</div>

<div id="err">
 <h2>Game loading error</h2>
 <p>The menu works, but the 3D engine failed to start.</p>
 <pre id="errText"></pre>
</div>

<script>
(function(){
const THREE_URL="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js";

function fail(e){document.getElementById("err").style.display="block";document.getElementById("errText").textContent=String(e&&e.stack||e);}

const script=document.createElement("script");
script.src=THREE_URL;
script.onload=()=>{try{start();}catch(e){fail(e)}};
script.onerror=()=>fail("Three.js could not be loaded. Check internet connection and refresh.");
document.head.appendChild(script);

let scene,camera,renderer,bike,clock,keys={},speed=0,heading=0,coins=0,xp=0,level=1;
let target=new THREE.Vector3(35,0,-45),phase="pickup",boost=false;
const $=id=>document.getElementById(id);

$("play").onclick=()=>{
 $("menu").style.display="none";$("hud").style.display="block";
 if(!renderer){try{start()}catch(e){fail(e)}}
};
// Auto-start: skip the landing screen and enter the game directly.
$("menu").style.display="none";
$("hud").style.display="block";
try{start()}catch(e){fail(e)};

$("wallet").onclick=async()=>{
 if(!window.ethereum){$("walletState").textContent="Wallet extension not found — guest mode is available.";return}
 try{
  const a=await ethereum.request({method:"eth_requestAccounts"});
  $("walletState").textContent="Wallet: "+a[0].slice(0,6)+"..."+a[0].slice(-4);
 }catch(e){$("walletState").textContent="Wallet connection cancelled."}
};

function start(){
 if(renderer)return;
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x07111d);
 scene.fog=new THREE.Fog(0x07111d,80,260);
 camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,600);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 document.getElementById("game").appendChild(renderer.domElement);
 clock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(0xaad6ff,0x263018,1.8));
 const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(80,120,50);sun.castShadow=true;scene.add(sun);

 makeCity(); bike=makeBike(); scene.add(bike);
 makeTarget(target,0xff8c1a);

 for(let i=0;i<16;i++) makeCar();
 addEvents();
 animate();
}

function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.72,metalness:.15})}
function box(w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.castShadow=true;m.receiveShadow=true;return m}
function makeCity(){
 const ground=box(360,.5,360,0x16231e);ground.position.y=-.35;scene.add(ground);
 for(let i=-150;i<=150;i+=30){
  let r=box(12,.25,360,0x20262b);r.position.set(i,0,0);scene.add(r);
  let r2=box(360,.25,12,0x20262b);r2.position.set(0,.01,i);scene.add(r2);
  for(let z=-160;z<=160;z+=30) addBuilding(i+8, z+8, 10+Math.random()*12, 8+Math.random()*25, 10+Math.random()*12);
 }
 for(let i=-165;i<=165;i+=30) for(let j=-165;j<=165;j+=30){
  if((Math.abs(i)+Math.abs(j))%60===0){
   const l=box(.25,5,.25,0xff9a35);l.position.set(i+6,2.5,j+6);scene.add(l);
   const glow=new THREE.PointLight(0xff9a35,3,22);glow.position.set(i+6,5,j+6);scene.add(glow);
  }
 }
}
function addBuilding(x,z,w,h,d){
 const b=box(w,h,d,Math.random()>.5?0x34414b:0x2b3740);b.position.set(x,h/2,z);scene.add(b);
 for(let y=4;y<h;y+=5){for(let xx=-w/2+2;xx<w/2;xx+=4){
  const win=box(1.2,.12,.08,0xf4b85d);win.position.set(x+xx,y,z-d/2-.05);scene.add(win);
 }}
}
function makeBike(){
 const g=new THREE.Group();
 const body=box(1.35,.48,2.3,0x171b20);body.position.y=1.05;g.add(body);
 const front=box(.65,.8,.65,0xff7e18);front.position.set(0,1.35,.72);g.add(front);
 const seat=box(.72,.22,.95,0x171717);seat.position.set(0,1.43,-.35);g.add(seat);
 const windshield=box(.6,.55,.08,0x80a8b8);windshield.position.set(0,1.8,.72);g.add(windshield);
 const wheelMat=mat(0x090909);
 [-.78,.78].forEach(z=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.18,20),wheelMat);w.rotation.z=Math.PI/2;w.position.set(0,.55,z);w.castShadow=true;g.add(w)});
 const boxx=box(1.15,1.0,.9,0xff7e18);boxx.position.set(0,2.0,-.7);g.add(boxx);
 const black=box(1.17,.08,.92,0x101214);black.position.set(0,2.52,-.7);g.add(black);
 const logo=box(.72,.3,.05,0x101214);logo.position.set(0,2.05,-1.16);g.add(logo);
 const rider=box(.55,.85,.4,0x263342);rider.position.set(0,1.95,.05);g.add(rider);
 const helmet=new THREE.Mesh(new THREE.SphereGeometry(.3,16,12),mat(0x101820));helmet.position.set(0,2.55,.05);g.add(helmet);
 g.position.set(0,0,0);g.castShadow=true;return g;
}
function makeTarget(pos,color){
 const ring=new THREE.Mesh(new THREE.TorusGeometry(2.2,.12,10,32),mat(color));ring.rotation.x=Math.PI/2;ring.position.copy(pos);ring.position.y=.2;scene.add(ring);
 const p=new THREE.PointLight(color,6,25);p.position.copy(pos);p.position.y=3;scene.add(p);
}
function makeCar(){
 const c=box(1.7,1.0,3.2,0x4c5964);c.position.set((Math.random()*300)-150,.55,(Math.random()*300)-150);
 c.userData.v=(Math.random()>.5?1:-1)*(5+Math.random()*10);c.userData.axis=Math.random()>.5?"x":"z";scene.add(c);
}
function addEvents(){
 addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
 addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
 $("boost").addEventListener("touchstart",e=>{e.preventDefault();boost=true},{passive:false});
 $("boost").addEventListener("touchend",()=>boost=false);
 $("brake").addEventListener("touchstart",e=>{e.preventDefault();speed=-8},{passive:false});
 $("brake").addEventListener("touchend",()=>{});
 let joy=$("joy"),knob=$("knob");
 function move(e){const r=joy.getBoundingClientRect(),p=e.touches?e.touches[0]:e;let dx=p.clientX-(r.left+r.width/2),dy=p.clientY-(r.top+r.height/2);let len=Math.hypot(dx,dy),max=40;if(len>max){dx*=max/len;dy*=max/len}knob.style.transform=`translate(${dx}px,${dy}px)`;keys.j=dx/max;keys.k=dy/max}
 function end(){knob.style.transform="";keys.j=0;keys.k=0}
 joy.addEventListener("touchstart",move,{passive:true});joy.addEventListener("touchmove",move,{passive:true});joy.addEventListener("touchend",end);
}
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.035);
 let acc=0;
 if(keys.w||keys.arrowup)acc=1;
 if(keys.s||keys.arrowdown)acc=-1;
 if(keys.j)acc=-keys.k;
 if(boost)acc=Math.max(acc,1.5);
 speed += acc*24*dt;
 speed*=Math.pow(.25,dt);
 speed=Math.max(-10,Math.min(boost?30:22,speed));
 let steer=(keys.a?-1:0)+(keys.d?1:0);
 if(keys.j)steer=keys.j;
 heading += steer*speed*.035*dt;
 bike.rotation.y=heading;
 bike.position.x += Math.sin(heading)*speed*dt;
 bike.position.z += Math.cos(heading)*speed*dt;
 bike.position.x=Math.max(-165,Math.min(165,bike.position.x));
 bike.position.z=Math.max(-165,Math.min(165,bike.position.z));

 const dx=target.x-bike.position.x,dz=target.z-bike.position.z;
 if(Math.hypot(dx,dz)<5){
  if(phase==="pickup"){phase="delivery";target.set((Math.random()*240)-120,0,(Math.random()*240)-120);$("status").textContent="📍 Package loaded! Ride to the green destination.";coins+=10;xp+=25}
  else{coins+=80;xp+=100;phase="pickup";target.set((Math.random()*240)-120,0,(Math.random()*240)-120);$("status").textContent="📦 New package: ride to orange pickup."; if(xp>=100){xp-=100;level++}}
 }
 $("coins").textContent=coins;$("xp").textContent=xp;$("level").textContent=level;$("speed").textContent=Math.round(Math.abs(speed)*3.2);
 camera.position.lerp(new THREE.Vector3(bike.position.x-Math.sin(heading)*9,4.8,bike.position.z-Math.cos(heading)*9),.09);
 camera.lookAt(bike.position.x,bike.position.y+1.2,bike.position.z);
 renderer.render(scene,camera);
}
})();
</script>
</body>
</html>
